# Program config for the DVWA (Damn Vulnerable Web Application) lab target.
# Used to exercise DeSlop against a well-known vulnerable app. Not a real
# program. See lab/docker-compose.yml for the target itself.
#
# DVWA defaults: admin / password, security level = low (set via env).
id: dvwa
name: "DVWA Lab"

in_scope:
  - kind: domain
    value: "127.0.0.1"
  - kind: domain
    value: "localhost"

out_of_scope:
  - kind: domain
    value: "dvwa-db"

staging:
  base_url: "http://127.0.0.1:14000"
  host_map:
    "dvwa.lab.test": "127.0.0.1:14000"
  reset:
    url: "http://127.0.0.1:14000/setup.php"
    method: "POST"

# DVWA ships a fixed set of accounts. admin is the triager account; the others
# are the IDOR/access-control victims.
test_accounts:
  - id: admin
    role: admin
    tenant: default
    username: "admin"
    password: "password"
  - id: user_a
    role: user
    tenant: default
    username: "gordonb"
    password: "abc123"
  - id: user_b
    role: user
    tenant: default
    username: "1337"
    password: "charley"
  - id: user_c
    role: user
    tenant: default
    username: "pablo"
    password: "letmein"

login:
  kind: form
  url: "http://127.0.0.1:14000/login.php"
  method: "POST"
  username_field: "username"
  password_field: "password"
  extra_fields:
    Login: "Login"
  csrf_field: "user_token"
  success_indicator: "logout.php"
  session_cookie: "PHPSESSID"

# DVWA reflects the victim's data in the SQLi module; the IDOR verifier looks
# for these markers returned to a different session.
duplicates:
  candidate_count: 10
  similarity_threshold: 0.80

bounty:
  - severity: high
    amount: 1000
  - severity: medium
    amount: 500
  - severity: low
    amount: 100

replies:
  language: en
  received: "Thanks, your DVWA lab report was received."

status_page:
  enabled: true
  token_ttl: "P30D"
  base_url: "http://127.0.0.1:8000"

max_requests_per_run: 50
allowed_egress_hosts:
  - "127.0.0.1"
