# Program config for the local DeSlop lab (lab/custom_app + oob).
# Used by the doctor command and the eval harness. Not a real program.
id: lab
name: "DeSlop Lab Program"

in_scope:
  - kind: wildcard
    value: "*.lab.test"
  - kind: domain
    value: "host.docker.internal"
  - kind: domain
    value: "localhost"

out_of_scope:
  - kind: domain
    value: "blog.lab.test"

excluded_classes:
  - id: missing-security-headers
    match: ["missing header", "security headers"]
    reason: "Not accepted without a demonstrated exploit."

staging:
  base_url: "http://host.docker.internal:18000"
  host_map:
    "api.lab.test": "host.docker.internal:18000"
    "www.lab.test": "host.docker.internal:18000"
  reset:
    url: "http://host.docker.internal:18000/__test__/reset"
    method: "POST"

# owned_markers: secrets that only appear in this account's own data on
# staging. The IDOR verifier proves a claim only when a marker owned by one
# account shows up in a response returned to another (or unauthenticated).
test_accounts:
  - id: user_a
    role: user
    tenant: tenant-one
    username: "alice"
    password: "alice-pass"
    owned_markers: ["ACME-INVOICE-ALICE-1001"]
  - id: user_b
    role: user
    tenant: tenant-one
    username: "bob"
    password: "bob-pass"
    owned_markers: ["ACME-INVOICE-BOB-1002"]
  - id: user_c_other_tenant
    role: user
    tenant: tenant-two
    username: "carol"
    password: "carol-pass"
    owned_markers: ["ACME-INVOICE-CAROL-1003"]
  - id: admin_a
    role: admin
    tenant: tenant-one
    username: "admin"
    password: "admin-pass"

login:
  kind: form
  url: "http://host.docker.internal:18000/api/login"
  method: "POST"
  username_field: "username"
  password_field: "password"
  session_cookie: "lab_session"

duplicates:
  candidate_count: 10
  similarity_threshold: 0.80

# Canary planted in the lab app (profile of user alice, i.e. user_a). The
# owner field lets the IDOR verifier treat the token as victim-owned proof;
# reports that never surface it get a reviewer note.
canary:
  enabled: true
  token: "CANARY-LAB-D3SL0P-7f2a"
  owner: user_a
  required_for: ["idor"]

bounty:
  - severity: critical
    amount: 5000
  - severity: high
    amount: 2000
  - severity: medium
    amount: 500
  - severity: low
    amount: 100

replies:
  language: en
  received: "Thanks, your report was received."

status_page:
  enabled: true
  token_ttl: "P30D"
  base_url: "http://localhost:8000"

allowed_egress_hosts:
  - "host.docker.internal"
