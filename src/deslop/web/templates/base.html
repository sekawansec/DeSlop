<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DeSlop{% endblock %}</title>
  <link rel="preload" href="/static/vendor/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/vendor/pico.zinc.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%2318181b'/></svg>">
  <script type="speculationrules">
    {"prerender": [{"source": "document", "eagerness": "moderate",
      "where": {"and": [{"href_matches": "/*"},
                        {"not": {"selector_matches": "[data-no-prerender]"}}]}}]}
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  {% block header %}
  <header class="container">
    <nav>
      <ul><li><a class="brand" href="/">DeSlop</a></li></ul>
      <ul>
        <li><a href="/guide" {% if active == 'guide' %}aria-current="page"{% endif %}>Guide</a></li>
        <li><a href="/submit" {% if active == 'submit' %}aria-current="page"{% endif %}>Submit</a></li>
        <li><a href="/dashboard" {% if active == 'dashboard' %}aria-current="page"{% endif %}>Triage</a></li>
      </ul>
    </nav>
  </header>
  {% endblock %}
  <main class="{% block container_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
<script>
/* Loading bar: appears only if a same-origin navigation is still pending
   after ~280ms, then crawls toward 92%. Removed by page unload or bfcache. */
(function () {
  var timer = null;
  function start() {
    if (timer) return;
    timer = setTimeout(function () {
      var bar = document.createElement('div');
      bar.id = 'loadbar';
      document.body.appendChild(bar);
      requestAnimationFrame(function () { bar.classList.add('on'); });
    }, 280);
  }
  document.addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest('a[href]');
    if (!a || a.target === '_blank' || a.dataset.filter !== undefined
        || a.hasAttribute('download') || a.hasAttribute('data-no-loadbar')) return;
    var url = new URL(a.href, location.href);
    if (url.origin !== location.origin) return;
    if (url.href === location.href) return;
    start();
  });
  document.addEventListener('submit', function (e) {
    if (e.target.target !== '_blank') start();
  });
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) {
      var bar = document.getElementById('loadbar');
      if (bar) bar.remove();
      timer = null;
    }
  });
})();
</script>
</body>
</html>
